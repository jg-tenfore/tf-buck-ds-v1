name: Deploy App to Netlify

# The standalone clickable prototype (Vite build) deploys to its own Netlify
# site, tf-buck-prototype.netlify.app — separate from the Storybook site.

on:
    push:
        branches: [main]
    workflow_dispatch:

# One app deploy at a time; let an in-progress run finish.
concurrency:
    group: netlify-app-deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build standalone app
              # Vite build -> dist-app/ (with the SPA _redirects for deep links).
              run: npm run build-app

            - name: Deploy to Netlify
              # Upload the prebuilt static output directly to the app site.
              # NETLIFY_SITE_ID targets tf-buck-prototype (not the Storybook site).
              run: npx --yes netlify-cli@27 deploy --prod --no-build --dir=dist-app
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_APP_SITE_ID }}
